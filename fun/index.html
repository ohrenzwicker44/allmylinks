<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>fun</title>
<style>
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    touch-action: none;
  }

  /* ===== "Reveal"-Screen — das hier sieht man zuerst. Klick/Tap
     blendet ihn aus und startet Bild + Ton im selben Moment. ===== */
  #reveal-screen{
    position:fixed; inset:0;
    background: var(--reveal-bg, #00b140);   /* Grün, siehe REVEAL_CONFIG unten */
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:10;
    padding: 32px;
    text-align:center;
    transition: opacity 0.25s ease;
  }
  #reveal-screen.hidden{
    opacity:0;
    pointer-events:none;
  }
  #reveal-text{
    font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
    color: var(--reveal-color, #ff0000);     /* Rot, siehe REVEAL_CONFIG unten */
    font-size: clamp(1.6rem, 7vw, 3.2rem);
    font-weight: bold;
    line-height: 1.3;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.15);
    /* Leichtes Pulsieren, damit klar ist, dass man klicken/tippen soll */
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* Bild wird über object-fit:fill exakt auf Bildschirmbreite/-höhe
     gestreckt — das Seitenverhältnis des Originalbilds wird dabei
     bewusst ignoriert (volle Fläche, keine Rücksicht auf Verzerrung,
     kein Letterboxing/Cropping). */
  #fullscreen-img{
    position:fixed; inset:0;
    width:100%; height:100%;
    object-fit:fill;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
  }
</style>
</head>
<body>

<!-- ==========================================================
     REVEAL-TEXT — hier änderbar. HTML-Zeilenumbruch mit <br> möglich.
     Farben/Hintergrund werden über REVEAL_CONFIG weiter unten im
     Script gesteuert (Standard: rote Schrift auf grünem Grund).
     ========================================================== -->
<div id="reveal-screen">
  <div id="reveal-text">Klick mich,<br>wenn du bereit bist… 👀</div>
</div>

<img id="fullscreen-img" src="assets/fun_image.jpg" alt="" style="display:none;">

<script>
  /* ==========================================================
     KONFIGURATION — hier lässt sich der Reveal-Screen anpassen,
     ohne den Rest des Scripts anfassen zu müssen.
     ========================================================== */
  const REVEAL_CONFIG = {
    backgroundColor: "#00b140", // Grün
    textColor: "#ff0000",       // Rot
  };
  const AUDIO_PATH = "assets/fun_music.mp3";

  document.documentElement.style.setProperty('--reveal-bg', REVEAL_CONFIG.backgroundColor);
  document.documentElement.style.setProperty('--reveal-color', REVEAL_CONFIG.textColor);

  let started = false;

  function reveal() {
    if (started) return;
    started = true;

    // Bild und Ton erscheinen/starten im selben Moment für den
    // Überraschungseffekt.
    document.getElementById('fullscreen-img').style.display = 'block';
    try {
      const audioEl = new Audio(AUDIO_PATH);
      audioEl.loop = true;
      audioEl.play().catch(() => {});
    } catch (e) {}

    const screen = document.getElementById('reveal-screen');
    screen.classList.add('hidden');
    // Nach dem Fade-out komplett aus dem Layout nehmen.
    setTimeout(() => { screen.style.display = 'none'; }, 300);
  }

  document.getElementById('reveal-screen').addEventListener('pointerdown', reveal);
  window.addEventListener('keydown', reveal, { once: true });
</script>
</body>
</html>
